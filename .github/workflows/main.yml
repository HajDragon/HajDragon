name: GitHub-Profile-Summary-Cards

on:
  schedule:
    # Every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Prefer a PAT stored as SUMMARY_GITHUB_TOKEN (gives access to private
          # contribution data); falls back to the built-in token.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 1        # Europe/Amsterdam (winter time)
          THEME: "radical"     # only generate the theme the README uses
          AUTO_PUSH: true
